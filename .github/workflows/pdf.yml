name: PDF and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '2'
      LEAN_MATHLIB: ${{ github.workspace }}/checks/lean/.lake/packages/mathlib
      LEAN_LAKE_ROOT: ${{ github.workspace }}/checks/lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.16'
          enable-cache: true
      - run: uv sync --locked
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: checks/lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          leanchecker: 'true'
          leanchecker-args: '--fresh Stereographic'
      - name: Install pinned Typst tools
        shell: uv run --locked python {0}
        run: |
          import hashlib, json, os, pathlib, tarfile, urllib.request
          config = json.loads(pathlib.Path('config/project.json').read_text())
          target = pathlib.Path(os.environ['RUNNER_TEMP'])/'typst-tools'
          target.mkdir()
          for name, spec in config['linux_tools'].items():
              archive = target/spec['url'].split('/')[-1]
              urllib.request.urlretrieve(spec['url'], archive)
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == spec['sha256'], name
              if spec.get('archive'):
                  with tarfile.open(archive) as tar:
                      tar.extractall(target/(name+'-files'), filter='data')
                  executable = next(p for p in (target/(name+'-files')).rglob(name) if p.is_file())
                  (target/name).symlink_to(executable)
              else:
                  archive.rename(target/name)
              (target/name).chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(target)+'\n')
      - name: Check and build
        run: uv run --locked python scripts/project.py check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markushevich-1-pdfs
          path: |
            build/markushevich.1.pdf
            build/markushevich.1.corrections.pdf
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: markushevich-1-pdfs
          path: build
      - name: Publish the release of this commit
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD: ${{ github.run_number }}
          TITLE: Маркушевич, Теория аналитических функций, том I
        run: |
          sha256sum --check SHA256SUMS
          date=$(date -u +%F)
          tag="$date.$BUILD"
          latest=false
          if [[ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" == "$SOURCE_SHA" ]]; then
            latest=true
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --latest="$latest" \
              --title "$TITLE · $date · build $BUILD" \
              --notes "Built on $date (UTC) from commit $SOURCE_SHA."
          fi
          gh release upload "$tag" ./*.pdf SHA256SUMS --clobber
